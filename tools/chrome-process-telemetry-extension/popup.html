<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome Process Telemetry</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Chrome Processes</h1>
        <button id="refresh" type="button">Refresh</button>
      </header>
      <p id="status">Loading...</p>
      <pre id="json" aria-label="Chrome process JSON"></pre>
      <table>
        <thead>
          <tr>
            <th>OS PID</th>
            <th>CPU</th>
            <th>Type</th>
            <th>Task</th>
            <th>URL</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
